{% extends 'va/base.html' %}

{% block title %}Add Record - VA System{% endblock %}

{% block content %}
  <h2>Add Verbal Autopsy Record</h2>

  <form method="post" class="form-horizontal">
    {% csrf_token %}

    {% for field in form %}
      <div class="form-group {% if field.errors %}has-error{% endif %}">
        <label class="control-label col-sm-3" for="{{ field.id_for_label }}">
          {{ field.label }}
        </label>
        <div class="col-sm-7">
          {{ field }}
          {% if field.errors %}
            <span class="help-block">{{ field.errors|striptags }}</span>
          {% endif %}
        </div>
      </div>
    {% endfor %}

    <div class="form-group">
      <div class="col-sm-offset-3 col-sm-7">
        <button type="submit" class="btn btn-primary">Save Record</button>
        <a href="{% url 'va:record_list' %}" class="btn btn-default">Cancel</a>
      </div>
    </div>
  </form>
{% endblock %}
